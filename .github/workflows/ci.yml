name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest and windows-latest are amd64; macos-latest is Apple
        # Silicon (arm64). ubuntu-24.04-arm adds the one architecture the
        # other three don't cover: linux/arm64, a release target with no
        # coverage otherwise. Without it, the file-locking and subprocess
        # behavior this suite exercises would ship on that arch compiled
        # but never actually run by CI.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt -l exits 0 whether or not it lists files, so a non-empty
      # result must be checked explicitly rather than trusted to the exit
      # code. Formatting is a property of the source text, not the OS, so
      # this only needs to run once; run it on the cheapest runner in the
      # matrix rather than gating on runner.os, which would also match
      # ubuntu-24.04-arm and run the check twice.
      - name: Check formatting (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat the following files:"
            echo "$unformatted"
            exit 1
          fi

      # comms spawns real child processes and exercises genuine
      # cross-process file locking, whose semantics differ by OS
      # (flock/fcntl on unix, LockFileEx on Windows), so the suite runs
      # on every matrix OS rather than being cross-compiled.
      - name: Test
        run: go test ./... -race -count=1
